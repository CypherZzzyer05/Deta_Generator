[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deta-generator"
version = "0.1.2"
description = "Portable seven-parameter As2Se3 tetramer dataset generation with native Lumerical FDTD"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "psutil>=5.9"]
readme = "README.md"

[project.scripts]
deta-generator = "deta_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deta_generator = ["assets/configs/*.json", "assets/materials/*.csv", "assets/materials/*.yml", "assets/materials/*.md"]
